<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">💰</div>
      <h1>個人財務系統</h1>
      <p class="subtitle">智慧理財助手</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">
          <span class="icon">👤</span> 用戶名
        </label>
        <input
          type="text"
          id="username"
          formControlName="username"
          class="form-control"
          placeholder="請輸入用戶名"
          [class.is-invalid]="submitted && f['username'].errors"
        />
        <div *ngIf="submitted && f['username'].errors" class="invalid-feedback">
          <span *ngIf="f['username'].errors['required']">用戶名不能為空</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">
          <span class="icon">🔒</span> 密碼
        </label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          placeholder="請輸入密碼"
          [class.is-invalid]="submitted && f['password'].errors"
        />
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <span *ngIf="f['password'].errors['required']">密碼不能為空</span>
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">
        <span class="alert-icon">⚠️</span>
        {{ error }}
      </div>

      <button 
        type="submit" 
        class="btn btn-primary btn-login" 
        [disabled]="loading"
      >
        <span *ngIf="loading" class="spinner">⏳</span>
        <span *ngIf="!loading">登入</span>
      </button>

      <div class="divider">
        <span>或</span>
      </div>

      <button 
        type="button" 
        class="btn btn-secondary btn-register" 
        routerLink="/register"
        [disabled]="loading"
      >
        <span class="icon">✨</span> 建立新帳戶
      </button>
    </form>

    <div class="footer">
      <p>© 2024 個人財務系統 - 安全可靠的財務管理</p>
    </div>
  </div>
</div>
